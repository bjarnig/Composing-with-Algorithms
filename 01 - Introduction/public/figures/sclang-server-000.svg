<text x="725" y="97" text-anchor="middle" font-size="20" font-weight="600">scsynth</text>
<text x="578" y="126" font-size="15" fill="#333">SynthDefs</text>
<text x="578" y="149" font-size="15" fill="#333">UGen graphs</text>
<text x="578" y="172" font-size="15" fill="#333">nodes and groups</text>
