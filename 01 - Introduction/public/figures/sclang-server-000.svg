<text x="725" y="360" text-anchor="middle" font-size="16">sound files, audio in</text>
<text x="490" y="412" text-anchor="middle" font-size="15" fill="#555" font-style="italic">two separate programs. Nothing you type makes a sound until a message crosses that arrow.</text>
