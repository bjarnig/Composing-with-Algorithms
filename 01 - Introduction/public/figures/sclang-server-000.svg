<text x="578" y="218" font-size="15" fill="#333">buffers</text>
<text x="195" y="60" text-anchor="middle" font-size="14" fill="#555" font-style="italic">the language you write</text>
<text x="725" y="60" text-anchor="middle" font-size="14" fill="#555" font-style="italic">the server that makes sound</text>
